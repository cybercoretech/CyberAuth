name: Signed Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: cyberauth-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Verify signing secrets are configured
        env:
          KEYSTORE: ${{ secrets.CYBERAUTH_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CYBERAUTH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYBERAUTH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYBERAUTH_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing CYBERAUTH_RELEASE_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing CYBERAUTH_RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing CYBERAUTH_RELEASE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing CYBERAUTH_RELEASE_KEY_PASSWORD'; exit 1; }
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CYBERAUTH_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyberauth-release.jks"
      - name: Test, lint, and build signed APK
        env:
          CYBERAUTH_RELEASE_STORE_FILE: ${{ runner.temp }}/cyberauth-release.jks
          CYBERAUTH_RELEASE_STORE_PASSWORD: ${{ secrets.CYBERAUTH_RELEASE_STORE_PASSWORD }}
          CYBERAUTH_RELEASE_KEY_ALIAS: ${{ secrets.CYBERAUTH_RELEASE_KEY_ALIAS }}
          CYBERAUTH_RELEASE_KEY_PASSWORD: ${{ secrets.CYBERAUTH_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare release assets and verification details
        env:
          CYBERAUTH_RELEASE_STORE_FILE: ${{ runner.temp }}/cyberauth-release.jks
          CYBERAUTH_RELEASE_STORE_PASSWORD: ${{ secrets.CYBERAUTH_RELEASE_STORE_PASSWORD }}
          CYBERAUTH_RELEASE_KEY_ALIAS: ${{ secrets.CYBERAUTH_RELEASE_KEY_ALIAS }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          grep -Fq "versionName = \"${version}\"" app/build.gradle.kts || { echo "Tag $TAG_NAME does not match app version $version"; exit 1; }
          apk="CyberAuth.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          keytool -list -v -keystore "$CYBERAUTH_RELEASE_STORE_FILE" -alias "$CYBERAUTH_RELEASE_KEY_ALIAS" -storepass "$CYBERAUTH_RELEASE_STORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}' > SIGNING_CERTIFICATE_SHA256.txt
          sed "s/{{VERSION}}/${version}/g" docs/RELEASE_NOTES.md > RELEASE_NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" CyberAuth.apk SHA256SUMS SIGNING_CERTIFICATE_SHA256.txt --title "CyberAuth ${TAG_NAME}" --notes-file RELEASE_NOTES.md
